<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swift Ship Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Swift Ship Tracker<small id="tag"></small></h1>
  <div class="tools">
    <button id="lang" aria-label="Language">தமிழ்</button>
    <button id="theme" aria-label="Theme">Dark</button>
  </div>
</header>
<main>
  <section>
    <div class="search"><input id="q" placeholder="Tracking no. e.g. SS3003" aria-label="Tracking number"><button id="go"></button></div>
    <div class="list" id="list"></div>
  </section>
  <section class="panel" id="detail"></section>
</main>
<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
